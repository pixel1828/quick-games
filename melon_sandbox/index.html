<html>

    <meta name="viewport"
          content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">

<title>Melon Sandbox</title>

<style>
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;

        background: #000;
        overflow: hidden;
    }

    #unity-container {
        width: 100%;

        position: relative;
    }

    #unity-canvas {
        width: 100%;
        height: 100%;
        background: #000;
    }

    #unity-loading-bar {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 300px;
    }

    #unity-progress-bar-empty {
        width: 100%;
        height: 20px;
        background: #333;
    }

    #unity-progress-bar-full {
        width: 0%;
        height: 100%;
        background: #fff;
    }

    #unity-warning {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        z-index: 10;
    }
</style>
```

</head>

<body>

<div id="unity-container">

```
<canvas id="unity-canvas"></canvas>

<div id="unity-loading-bar">
    <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
    </div>
</div>

<div id="unity-warning"></div>

</div>

<script src="../plugins/Unity/UnityLoader.js"></script>

<script>
    var container = document.querySelector("#unity-container");
    var canvas = document.querySelector("#unity-canvas");
    var loadingBar = document.querySelector("#unity-loading-bar");
    var progressBarFull = document.querySelector("#unity-progress-bar-full");
    var warningBanner = document.querySelector("#unity-warning");

    var gameInstance = null;

    function unityShowBanner(msg, type) {
        var div = document.createElement("div");

        div.innerHTML = msg;

        if (type === "error") {
            div.style = "background: red; padding: 10px;";
        } else {
            div.style = "background: yellow; padding: 10px;";

            setTimeout(function () {
                if (div.parentNode) {
                    div.parentNode.removeChild(div);
                }
            }, 5000);
        }

        warningBanner.appendChild(div);
    }

    var canvasElement = document.createElement("canvas");

    var gl1 = canvasElement.getContext("webgl");
    var gl2 = canvasElement.getContext("webgl2");

    var gl = null;

    if (gl2) {
        console.log("Found GL2 Context", gl2);
        gl = gl2;
    }
    else if (gl1) {
        console.log("Found GL1 Context", gl1);
        gl = gl1;
    }

    if (gl && gl.getExtension("WEBGL_compressed_texture_astc")) {
        console.log("WebGL ASTC extension Found! Switched");
    }
    else {
        console.log("Switched to DXT");
    }

    var config = {
        dataUrl: "Build/build.data.unityweb",

        frameworkUrl:
            "Build/build.framework.js.unityweb",

        codeUrl:
            "Build/build.wasm.unityweb",

        streamingAssetsUrl:
            "StreamingAssets",

        companyName:
            "27 Studio",

        productName:
            "Melon Sandbox",

        productVersion:
            "37.1",

        showBanner:
            unityShowBanner
    };

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {

        var meta = document.createElement("meta");

        meta.name = "viewport";

        meta.content =
            "width=device-width, height=device-height, " +
            "initial-scale=1.0, user-scalable=no, shrink-to-fit=yes";

        document
            .getElementsByTagName("head")[0]
            .appendChild(meta);

        container.className = "unity-mobile";
        canvas.className = "unity-mobile";

        config.devicePixelRatio = 1.2;
    }

    loadingBar.style.display = "block";

    createUnityInstance(
        canvas,
        config,
        function (progress) {
            progressBarFull.style.width =
                (100 * progress) + "%";
        }
    )
    .then(function (unityInstance) {

        console.log(
            "UnityInstance Created!",
            unityInstance
        );

        window.unityInstance = unityInstance;
        gameInstance = unityInstance;

        loadingBar.style.display = "none";

    })
    .catch(function (message) {

        console.error(
            "Unity failed to start:",
            message
        );

        unityShowBanner(
            String(message),
            "error"
        );
    });
</script>

</body>
</html>
