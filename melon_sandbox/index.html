<!DOCTYPE html>

<html> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">

<title>Melon Sandbox</title>

<style>
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
    }

    #unity-container {
        width: 100%;
        height: 100%;
        position: relative;
    }

    #unity-canvas {
        width: 100%;
        height: 100%;
        background: #000;
    }

    #unity-loading-bar {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 300px;
    }

    #unity-progress-bar-empty {
        width: 100%;
        height: 20px;
        background: #333;
    }

    #unity-progress-bar-full {
        width: 0%;
        height: 100%;
        background: #fff;
    }

    #unity-warning {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        z-index: 10;
    }

    #fb_popup_overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.7);
        backdrop-filter: blur(4px);
        z-index: 9998;
        display: none;
    }

    #fb_popup_container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 9999;
    }

    .fb-modal {
        background-color: #333;
        border: 4px solid white;
        width: 360px;
        padding: 20px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        user-select: none;
    }

    .fb-modal-content {
        color: white;
        text-align: center;
        margin-bottom: 20px;
        font-size: 20px;
        user-select: none;
        pointer-events: none;
    }

    .fb-modal-buttons {
        display: flex;
        justify-content: space-between;
        user-select: none;
    }

    .fb-modal-button {
        background-color: #333;
        color: white;
        border: 2px solid white;
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
        flex: 1;
        margin: 0 5px;
    }

    .fb-select-button {
        margin-right: 20px;
    }

    .fb-close-button {
        margin-left: 5px;
    }

    .fb-file-input {
        display: none;
    }
</style>

</head>

<body>

<div id="unity-container">

<canvas id="unity-canvas"></canvas>

<div id="unity-loading-bar">
    <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
    </div>
</div>

<div id="unity-warning"></div>

</div>

<div id="fb_popup_overlay"></div>

<div id="fb_popup_container">

<div class="fb-modal">

    <div id="fb_popup_description_title"
         class="fb-modal-content">
        Description
    </div>

    <div class="fb-modal-buttons">

        <input
            type="file"
            id="fileInput"
            class="fb-file-input"
            onchange="fbLoadFiles(event.target.files); return false;"
        >

        <button
            id="fb_popup_select_button_title"
            class="fb-modal-button fb-select-button"
            onclick="document.getElementById('fileInput').click()">
            Select
        </button>

        <button
            id="fb_popup_close_button_title"
            class="fb-modal-button fb-close-button"
            onclick="requestCloseFileBrowserForOpen()">
            Close
        </button>

    </div>

</div>

</div>

<script> function callFBFunctionByName(functionName, parameter) { switch (functionName) { case "initializeFBLibrary": initializeFBLibrary(); break; case "openFileBrowserForLoad": openFileBrowserForLoad(parameter); break; case "cleanupFB": cleanupFB(); break; case "closeFileBrowserForOpen": closeFileBrowserForOpen(); break; case "saveFile": saveFileFB(parameter); break; case "setLocalization": setLocalizationFB(parameter); break; } } document.callFBFunctionByName = callFBFunctionByName; function initializeFBLibrary() { document.fbPopup = document.getElementById("fb_popup_container"); document.fbOverlay = document.getElementById("fb_popup_overlay"); document.fbOpenFilePopupInput = document.getElementById("fileInput"); document.fbStorage = { initialized: true, loadedFiles: {}, dataPointers: [] }; } function openFileBrowserForLoad(parameters) { if ( !document.fbStorage || document.fbStorage.initialized !== true ) { return; } var typesFilter = parameters[0]; var isMultipleSelection = parameters[1] === 1; var isFolder = parameters[2] === 1; document.fbOpenFilePopupInput .removeAttribute("multiple"); document.fbOpenFilePopupInput .removeAttribute("webkitdirectory"); if ( isMultipleSelection && !isFolder ) { document.fbOpenFilePopupInput .setAttribute("multiple", ""); } if (isFolder) { document.fbOpenFilePopupInput .setAttribute("webkitdirectory", ""); } document.fbOpenFilePopupInput.accept = typesFilter; document.fbOverlay.style.display = "block"; document.fbPopup.style.display = "flex"; } function closeFileBrowserForOpen() { if ( !document.fbStorage || document.fbStorage.initialized !== true ) { return; } document.fbOverlay.style.display = "none"; document.fbPopup.style.display = "none"; } function cleanupFB() { if ( !document.fbStorage || document.fbStorage.initialized !== true ) { return; } document.fbStorage.loadedFiles = {}; document.fbStorage.dataPointers = []; } function saveFileFB(fileData) { if ( !document.fbStorage || document.fbStorage.initialized !== true ) { r essage( libraryHandlerObjectName, "CloseFileBrowserForOpen" ); } function fbBase64ToBytesArray(base64) { var binary_string = window.atob(base64); var len = binary_string.length; var bytes = new Uint8Array(len); for ( var i = 0; i < len; i++ ) { bytes[i] = binary_string.charCodeAt(i); } return bytes.buffer; } function setLocalizationFB(parameter) { switch (parameter.key) { case "HEADER_TITLE": break; case "DESCRIPTION_TEXT": document.getElementById( "fb_popup_description_title" ).innerHTML = parameter.value; break; case "SELECT_BUTTON_CONTENT": document.getElementById( "fb_popup_select_button_title" ).innerHTML = parameter.value; break; case "CLOSE_BUTTON_CONTENT": document.getElementById( "fb_popup_close_button_title" ).innerHTML = parameter.value; break; } } document.addEventListener( "DOMContentLoaded", function () { initializeFBLibrary(); } ); </script>

</body> 

</html>
